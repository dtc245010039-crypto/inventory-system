version: '3.3'
services:
  mysql:
    image: mysql:8.0
    container_name: inventory_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: inventory_nginx
    ports:
      - "80:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: inventory_prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: inventory_grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    container_name: inventory_loki
    ports:
      - "3100:3100"
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: inventory_phpmyadmin
    environment:
      PMA_HOST: inventory_mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"

  webapp:
    image: php:8.2-apache
    container_name: inventory_webapp
    ports:
      - "8000:80"
    volumes:
      - ./html:/var/www/html
